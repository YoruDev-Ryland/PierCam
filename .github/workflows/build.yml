name: Build installer

# Public repositories get unlimited standard-runner minutes, so this builds on every push to
# main. Doc-only changes are skipped anyway: a README edit does not need a 3-minute Windows
# build. If this repository is ever made private again, note that Windows runners bill at 2x
# against the free plan's monthly allowance and this trigger should go back to tags only.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  # A v* tag cuts a real, permanent release.
  # Pushing a tag also pushes its commit, so both triggers can fire; the concurrency group
  # below is keyed on the ref, which keeps them from fighting over the same release.

# A newer run supersedes an older one on the same ref rather than both finishing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to create releases

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, so a main build can name itself after the last release

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
            $release = 'tag'
          } else {
            # Name a development build after the most recent release plus the run number, so
            # successive builds sort sensibly and the assembly carries something traceable.
            $last = (git tag --list 'v*' --sort=-v:refname | Select-Object -First 1) -replace '^v', ''
            if (-not $last) { $last = '0.0' }
            $parts = @($last -split '\.') + @('0','0')
            $v = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
            $release = if ($env:GITHUB_EVENT_NAME -eq 'push') { 'rolling' } else { 'none' }
          }
          "version=$v"  >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, release mode $release"

      # ffmpeg is ~98 MB and deliberately not in the repository. The cache is per-repository and
      # generous (10 GB) on every plan, so this downloads once rather than once per run.
      - name: Restore cached ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: tools/ffmpeg.exe
          key: ffmpeg-win64-gpl-essentials-v2

      - name: Fetch ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Gyan's "essentials" build first: a curated GPL build with everything PierCam needs
          # (libx264, hqdn3d, scale, rawvideo) at ~98 MB, against ~157 MB for a full master
          # build. That 59 MB is in every download a user makes. BtbN is the fallback because it
          # is hosted on GitHub and will be reachable from a runner even if the first host is not.
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $ok = $false
          foreach ($url in $sources) {
            try {
              Write-Host "trying $url"
              Invoke-WebRequest $url -OutFile ffmpeg.zip -UseBasicParsing -TimeoutSec 300
              $ok = $true; break
            } catch { Write-Warning "failed: $($_.Exception.Message)" }
          }
          if (-not $ok) { throw 'could not download ffmpeg from any source' }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $exe = Get-ChildItem ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Path tools -Force | Out-Null
          Copy-Item $exe.FullName tools/ffmpeg.exe -Force
          Remove-Item ffmpeg.zip, ffmpeg-extract -Recurse -Force
          '{0:N1} MB' -f ((Get-Item tools/ffmpeg.exe).Length / 1MB)

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) {
            Write-Host 'Inno Setup already on the image'
          } elseif (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
            Write-Host 'Inno Setup 6 already installed'
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Build drop and installer
        shell: pwsh
        run: ./publish.ps1 -Installer -Version ${{ steps.ver.outputs.version }}

      - name: Check what was produced
        shell: pwsh
        run: Get-ChildItem dist -File | ForEach-Object { '{0,-40} {1,8:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      # A permanent, versioned release for a tag.
      - name: Publish release
        if: steps.ver.outputs.release == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*Setup.exe, dist/*.zip).FullName `
            --title "PierCam ${{ steps.ver.outputs.version }}" `
            --generate-notes

      # One rolling pre-release that always reflects main, replaced on each push rather than
      # accumulating a release per commit.
      - name: Update rolling build
        if: steps.ver.outputs.release == 'rolling'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest (Get-ChildItem dist/*Setup.exe, dist/*.zip).FullName `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "Latest build from main (${{ steps.ver.outputs.version }})" `
            --notes "Automatic build of the current main branch, replaced on every push. For a stable download use the latest tagged release instead."

      # Pull requests build but publish nothing; keep the installer briefly so it can be tried.
      - name: Upload installer
        if: steps.ver.outputs.release == 'none'
        uses: actions/upload-artifact@v7
        with:
          name: PierCam-${{ steps.ver.outputs.version }}-Setup
          path: dist/*Setup.exe
          retention-days: 7
          compression-level: 0   # already compressed; recompressing wastes a minute
